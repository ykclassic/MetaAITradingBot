name: Quantitative Trading Pipeline

on:
  schedule:
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quantitative-trading-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run Tests
        run: python -m pytest -q

  execute-trading-cycle:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Verify XT credentials are configured
        env:
          XT_API_KEY: ${{ secrets.XT_API_KEY }}
          XT_SECRET_KEY: ${{ secrets.XT_SECRET_KEY }}
        run: |
          test -n "$XT_API_KEY" || { echo "XT_API_KEY GitHub Actions secret is missing or empty."; exit 1; }
          test -n "$XT_SECRET_KEY" || { echo "XT_SECRET_KEY GitHub Actions secret is missing or empty."; exit 1; }
      - name: Execute Safe Trading Cycle Verification
        env:
          XT_API_KEY: ${{ secrets.XT_API_KEY }}
          XT_SECRET_KEY: ${{ secrets.XT_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TRADE_SYMBOLS: BTC_USDT,ETH_USDT
          TIMEFRAME: M15
          RISK_PER_TRADE_PCT: '0.01'
          MAX_DAILY_DRAWDOWN_PCT: '0.05'
          MAX_OPEN_POSITIONS: '3'
          CONTRACT_SIZE: '1.0'
          MODEL_VERSION: v1.0.0
          MODEL_DIR: models/
          LOOKBACK_PERIODS: '100'
          RUN_ONCE: 'true'
          LIVE_TRADING_ENABLED: 'false'
          PYTHONUNBUFFERED: '1'
        run: python main.py

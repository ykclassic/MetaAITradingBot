name: Quantitative Trading Pipeline

on:
  # Scheduled execution: Runs every 15 minutes to align with the M15 timeframe strategy
  schedule:
    - cron: '*/15 * * * 1-5' # Runs every 15 mins, Monday through Friday
  
  # Allows manual triggering from the GitHub Actions tab for testing
  workflow_dispatch:

jobs:
  execute-trading-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Fail fast to prevent runaway compute costs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up execution by caching dependencies

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Trading Engine
        env:
          # Cloud Database Persistence
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          
          # XT.com Exchange Credentials
          XT_API_KEY: ${{ secrets.XT_API_KEY }}
          XT_SECRET_KEY: ${{ secrets.XT_SECRET_KEY }}
          
          # Trading Parameters
          TRADE_SYMBOLS: "BTC_USDT,ETH_USDT" 
          TIMEFRAME: "M15"
          RISK_PER_TRADE_PCT: "0.01"
          MAX_DAILY_DRAWDOWN_PCT: "0.05"
          MODEL_VERSION: "v1.0.0"
        
        # Executes the composition root. 
        # The script will run one full cycle across the symbols, log state to Supabase, and exit gracefully.
        run: |
          python main.py